<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        background: radial-gradient(900px 520px at 18% -10%, #1b2638 0%, #0b1018 62%);
        color: #e8eaed;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 100px;
      }
      .mark { width: 248px; height: 248px; flex: 0 0 auto; }
      .mark svg { width: 100%; height: 100%; }
      h1 { font-size: 104px; letter-spacing: -3px; line-height: 1; }
      .tag { margin-top: 30px; font-size: 33px; color: #9fb0c8; line-height: 1.55; }
      .url { margin-top: 44px; font-size: 30px; color: #5b95ff; font-family: ui-monospace, Consolas, monospace; }
    </style>
  </head>
  <body>
    <div class="mark">__ICON_SVG__</div>
    <div>
      <h1>SixDrop</h1>
      <div class="tag">六位取件码 · 点对点直传<br />文件不经过服务器</div>
      <div class="url">sixdrop.example</div>
    </div>
  </body>
</html>
